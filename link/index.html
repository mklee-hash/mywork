<!DOCTYPE html>
<html>
<head>
<script src="../common/static.js" data-root="../"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>링크</title>
<link rel="stylesheet" href="../common/server.css">
<style>
	#content { flex: 1; min-height: 0; overflow-y: auto; padding: 16px 20px 40px; background: #f1f5f9; }
	#cards { column-width: 270px; column-gap: 14px; }
	.card { break-inside: avoid; margin: 0 0 14px; background: #fff; border: 1px solid var(--line); border-radius: 10px; }
	.card > header { display: flex; align-items: center; gap: 6px; padding: 9px 12px; border-bottom: 1px solid var(--line); font-weight: bold; }
	.card > header .cnt { padding: 0 7px; border-radius: 9px; background: #e2e8f0; color: #475569; font-size: 11px; font-weight: normal; }
	.card ul { list-style: none; margin: 0; padding: 4px 0; }
	.card li a { display: block; padding: 6px 12px; color: #0f172a; text-decoration: none; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
	.card li a:hover { background: #f0fdfa; color: #0f766e; }
	.card li a .dm { margin-left: 6px; color: #94a3b8; font-size: 11px; }
	/* 계정·암호가 있는 링크: 오른쪽 'ID/PW' 표시, 누르면 풍선 */
	.card li { position: relative; display: flex; align-items: center; }
	.card li a { flex: 1; min-width: 0; }
	.card li .key { flex: none; margin-right: 8px; padding: 1px 6px; border: 1px solid #cbd5e1; border-radius: 9px; background: #fff; color: #475569; font: inherit; font-size: 10.5px; line-height: 15px; cursor: pointer; }
	.card li .key:hover { border-color: var(--accent); color: #0f766e; background: #f0fdfa; }
	#cred { position: fixed; z-index: 95; display: none; width: 300px; padding: 10px 12px; background: #fff; border: 1px solid var(--line2); border-radius: 8px; box-shadow: 0 10px 30px rgba(15, 23, 42, .2); font-size: 13px; }
	#cred.open { display: block; }
	#cred .t { margin-bottom: 6px; font-weight: bold; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
	#cred .r { display: flex; align-items: center; gap: 4px; padding: 3px 0; }
	#cred .r .l { width: 34px; flex: none; color: var(--muted); font-size: 12px; }
	#cred .r .v { flex: 1; min-width: 0; font-family: Consolas, monospace; word-break: break-all; }
	#cred .note { margin-top: 4px; color: #475569; white-space: pre-wrap; }
	mark { background: #fde68a; padding: 0; }
	.empty { padding: 40px; text-align: center; color: var(--muted); }
	/* 편집: 입력칸이 들어가게 카드를 넓게 */
	.edit #cards { column-width: 430px; }
	.edit .card > header input { flex: 1; font-weight: bold; }
	.edit .lk { padding: 3px 8px; }
	.edit .lk .lm, .edit .lk .ls { display: flex; gap: 4px; align-items: center; }
	.edit .lk .ls { display: none; padding: 4px 0 4px 20px; }
	.edit .lk.open .ls { display: flex; }
	.edit .lk .ls input.a { flex: 2; }
	.edit .lk .ls input.p { flex: 2; font-family: Consolas, monospace; }
	.edit .lk .ls input.m { flex: 3; }
	.edit .lk .cb { flex: none; height: 26px; padding: 0 8px; font-size: 12px; }
	.edit .lk .cb.on { border-color: #f59e0b; background: #fffbeb; color: #92400e; }
	.edit .lk.drag { opacity: .4; }
	.edit .lk.over { box-shadow: inset 0 2px 0 var(--accent); }
	.edit .lk .h { cursor: grab; color: #94a3b8; user-select: none; padding: 0 2px; }
	.edit .lk input { min-width: 0; height: 26px; font-size: 12px; }
	.edit .lk input.t { flex: 2; }
	.edit .lk input.u { flex: 3; color: #475569; }
	.edit .add { margin: 4px 8px 8px; }
	.edit .card.over { outline: 2px dashed var(--accent); }
	.ib { width: 22px; height: 22px; padding: 0; border: 1px solid transparent; border-radius: 4px; background: none; color: #64748b; cursor: pointer; font-size: 12px; flex: none; }
	.ib:hover { background: #e2e8f0; color: #0f172a; }
	/* 가져오기 */
	#imp { position: fixed; inset: 0; z-index: 90; display: none; align-items: flex-start; justify-content: center; padding-top: 80px; background: rgba(15, 23, 42, .35); }
	#imp.open { display: flex; }
	#imp .box { width: 420px; max-width: calc(100% - 32px); padding: 18px 20px; background: #fff; border-radius: 10px; box-shadow: 0 20px 50px rgba(15, 23, 42, .3); }
	#imp h3 { margin: 0 0 6px; font-size: 16px; }
	#imp select { width: 100%; margin: 10px 0; }
	#imp .row { display: flex; gap: 8px; justify-content: flex-end; }
</style>
</head>
<body>
<div id="bar">
	<h2>링크</h2>
	<input class="inp" id="q" placeholder="링크 찾기 (이름 · 주소)" style="width:240px">
	<span id="qn" class="muted"></span>
	<span class="spacer"></span>
	<span class="grp" id="viewBtns">
		<button class="btn rw" id="bImp" title="이 PC 크롬의 즐겨찾기 바를 가져와 합침">크롬 즐겨찾기 가져오기</button>
		<button class="btn primary rw" id="bEdit">편집</button>
	</span>
	<span class="grp" id="editBtns" style="display:none">
		<button class="btn" id="bAddGroup">＋ 카테고리</button>
		<button class="btn" id="bCancel">취소</button>
		<button class="btn primary" id="bSave" title="저장 (Ctrl+S)">저장</button>
	</span>
</div>
<div id="content"><div id="cards"></div></div>
<div id="status">
	<span id="sInfo"></span>
	<span class="spacer"></span>
	<span id="msg"></span>
</div>
<div id="cred"></div>
<div id="imp">
	<div class="box">
		<h3>크롬 즐겨찾기 가져오기</h3>
		<div class="muted">즐겨찾기 바의 폴더는 카테고리로, 폴더 안 폴더는 "상위 / 하위" 카테고리로 가져옵니다. 같은 이름 카테고리는 합치고, 이미 있는 주소는 건너뜁니다.</div>
		<select class="inp" id="impProfile"></select>
		<div class="row"><span id="impMsg" class="muted" style="flex:1"></span><button class="btn" id="impClose">닫기</button><button class="btn primary" id="impGo">가져오기</button></div>
	</div>
</div>

<script>
	var API = "../common/data.jsp?space=link&doc=links";
	var data = { type: "links", groups: [] }, ver = "", editing = false, term = "";

	function $(id) { return document.getElementById(id); }
	function esc(s) { return String(s == null ? "" : s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }
	function msg(t, cls) { var m = $("msg"); m.textContent = t || ""; m.className = cls || ""; }
	function now() { var d = new Date(), p = function (n) { return (n < 10 ? "0" : "") + n; }; return d.getFullYear() + "-" + p(d.getMonth() + 1) + "-" + p(d.getDate()) + " " + p(d.getHours()) + ":" + p(d.getMinutes()) + ":" + p(d.getSeconds()); }
	function uid(p) { return p + Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }
	function host(u) { try { return new URL(u).hostname.replace(/^www\./, ""); } catch (e) { return ""; } }
	function hl(s) {
		var h = esc(s);
		if (!term) return h;
		var t = esc(term).replace(/[.*+?^$|()[\]{}\\]/g, "\$&");
		return h.replace(new RegExp("(" + t + ")", "gi"), "<mark>$1</mark>");
	}

	// ---------------------------------------------------------------- 보기
	function render() {
		$("content").classList.toggle("edit", editing);
		$("viewBtns").style.display = editing ? "none" : "";
		$("editBtns").style.display = editing ? "" : "none";
		$("q").style.display = editing ? "none" : "";
		if (editing) return renderEdit();
		var lc = term.toLowerCase(), total = 0, shown = 0;
		var h = data.groups.map(function (g) {
			total += g.links.length;
			var ls = g.links.filter(function (l) { return !lc || (l.title + " " + l.url + " " + g.title).toLowerCase().indexOf(lc) >= 0; });
			if (lc && !ls.length) return "";
			shown += ls.length;
			return '<section class="card"><header>' + hl(g.title) + '<span class="cnt">' + ls.length + "</span></header><ul>"
				+ ls.map(function (l) {
					return '<li><a href="' + esc(l.url) + '" target="_blank" rel="noopener" title="' + esc(l.url) + '">' + hl(l.title || l.url) + '<span class="dm">' + esc(host(l.url)) + "</span></a>"
						+ (hasCred(l) ? '<button class="key" data-cred="' + esc(l.id) + '" title="계정 · 암호 보기">ID/PW</button>' : "") + "</li>";
				}).join("") + "</ul></section>";
		}).join("");
		$("cards").innerHTML = h || '<div class="empty">' + (data.groups.length ? "찾는 링크가 없습니다." : "링크가 없습니다." + (window.MK_STATIC ? "" : " [크롬 즐겨찾기 가져오기] 또는 [편집]으로 넣으세요.")) + "</div>";
		$("qn").textContent = term ? shown + "개" : "";
		$("sInfo").textContent = "카테고리 " + data.groups.length + " · 링크 " + total + (data.savedAt ? " · 저장 " + data.savedAt : "");
	}
	$("q").addEventListener("input", function () { term = this.value.trim(); render(); });

	// ---------------------------------------------------------------- 계정 · 암호 (ID/PW)
	function hasCred(l) { return !!(l.user || l.pw || l.note); }
	function copyText(v) {
		function done() { msg("복사했습니다.", "ok"); }
		if (navigator.clipboard && window.isSecureContext) { navigator.clipboard.writeText(v).then(done); return; }
		var t = document.createElement("textarea");
		t.value = v;
		document.body.appendChild(t);
		t.select();
		document.execCommand("copy");
		t.remove();
		done();
	}
	var credLink = null;
	function showCred(btn, l) {
		credLink = l;
		var row = function (label, v, secret) {
			return '<div class="r"><span class="l">' + label + '</span><span class="v"' + (secret ? ' data-sec="1">••••••' : ">" + esc(v)) + "</span>"
				+ (secret ? '<button class="ib" data-ceye title="보기/숨기기">👁</button>' : "")
				+ '<button class="ib" data-ccopy="' + (secret ? "pw" : "user") + '" title="복사">⧉</button></div>';
		};
		$("cred").innerHTML = '<div class="t">' + esc(l.title) + "</div>" + (l.user ? row("계정", l.user) : "") + (l.pw ? row("암호", l.pw, true) : "")
			+ (l.note ? '<div class="note">' + esc(l.note) + "</div>" : "");
		var b = btn.getBoundingClientRect(), box = $("cred");
		box.classList.add("open");
		box.style.left = Math.max(8, Math.min(b.right - box.offsetWidth, innerWidth - box.offsetWidth - 8)) + "px";
		box.style.top = (b.bottom + box.offsetHeight + 8 > innerHeight ? b.top - box.offsetHeight - 4 : b.bottom + 4) + "px";
	}
	function hideCred() { $("cred").classList.remove("open"); credLink = null; }
	$("cred").addEventListener("click", function (e) {
		var t = e.target;
		if (!credLink) return;
		if (t.hasAttribute("data-ceye")) {
			var v = $("cred").querySelector("[data-sec]");
			v.textContent = v.textContent === credLink.pw ? "••••••" : credLink.pw;
		} else if (t.hasAttribute("data-ccopy")) copyText(t.getAttribute("data-ccopy") === "pw" ? credLink.pw : credLink.user);
	});
	document.addEventListener("mousedown", function (e) { if (!e.target.closest("#cred") && !e.target.closest("[data-cred]")) hideCred(); });
	$("content").addEventListener("scroll", hideCred);
	$("cards").addEventListener("click", function (e) {
		var b = e.target.closest("[data-cred]");
		if (!b || editing) return;
		e.preventDefault();
		var id = b.getAttribute("data-cred"), l = null;
		data.groups.forEach(function (g) { g.links.forEach(function (x) { if (x.id === id) l = x; }); });
		if (!l) return;
		if (credLink === l) hideCred(); else showCred(b, l);
	});

	// ---------------------------------------------------------------- 편집
	var draft = null;
	function renderEdit() {
		$("cards").innerHTML = draft.groups.map(function (g, gi) {
			return '<section class="card" data-g="' + gi + '"><header><input class="inp" data-gt value="' + esc(g.title) + '" placeholder="카테고리 이름">'
				+ '<button class="ib" data-gmv="-1" title="앞으로">▲</button><button class="ib" data-gmv="1" title="뒤로">▼</button><button class="ib" data-gdel title="카테고리 삭제">✕</button></header>'
				+ g.links.map(function (l, li) {
					return '<div class="lk' + (hasCred(l) ? " open" : "") + '" draggable="true" data-l="' + li + '"><div class="lm"><span class="h" title="끌어서 옮기기">⋮⋮</span>'
						+ '<input class="inp t" data-lt value="' + esc(l.title) + '" placeholder="이름"><input class="inp u" data-lu value="' + esc(l.url) + '" placeholder="https://">'
						+ '<button class="btn cb' + (hasCred(l) ? " on" : "") + '" data-lkey title="계정 · 암호 · 메모 칸 열기/닫기">계정·암호</button><button class="ib" data-ldel title="링크 삭제">✕</button></div>'
						+ '<div class="ls"><input class="inp a" data-la value="' + esc(l.user) + '" placeholder="계정" autocomplete="off">'
						+ '<input class="inp p" type="password" data-lp value="' + esc(l.pw) + '" placeholder="암호" autocomplete="new-password">'
						+ '<button class="ib" data-lpeye title="암호 보기">👁</button><input class="inp m" data-lm value="' + esc(l.note) + '" placeholder="메모"></div></div>';
				}).join("")
				+ '<button class="btn add" data-ladd>＋ 링크</button></section>';
		}).join("") || '<div class="empty">[＋ 카테고리]로 시작하세요.</div>';
		$("sInfo").textContent = "편집 중 · 링크는 ⋮⋮ 를 끌어서 다른 카테고리로 옮길 수 있습니다";
	}
	// 화면 입력값을 draft 에 반영
	function collect() {
		Array.prototype.forEach.call($("cards").querySelectorAll(".card[data-g]"), function (c) {
			var g = draft.groups[+c.getAttribute("data-g")];
			g.title = c.querySelector("[data-gt]").value.trim();
			Array.prototype.forEach.call(c.querySelectorAll(".lk"), function (r) {
				var l = g.links[+r.getAttribute("data-l")];
				l.title = r.querySelector("[data-lt]").value.trim();
				l.url = r.querySelector("[data-lu]").value.trim();
				// 계정·암호·메모는 비면 지움 (암호 앞뒤 공백은 그대로 둠)
				var u = r.querySelector("[data-la]").value.trim(), p = r.querySelector("[data-lp]").value, m = r.querySelector("[data-lm]").value.trim();
				if (u) l.user = u; else delete l.user;
				if (p) l.pw = p; else delete l.pw;
				if (m) l.note = m; else delete l.note;
			});
		});
	}
	$("bEdit").onclick = function () { draft = JSON.parse(JSON.stringify(data)); editing = true; render(); };
	$("bCancel").onclick = function () {
		collect();
		if (JSON.stringify(draft.groups) !== JSON.stringify(data.groups) && !confirm("고친 내용을 버릴까요?")) return;
		editing = false; render();
	};
	$("bAddGroup").onclick = function () {
		collect();
		draft.groups.push({ id: uid("g"), title: "", links: [] });
		renderEdit();
		var ins = $("cards").querySelectorAll("[data-gt]");
		ins[ins.length - 1].focus();
	};
	$("cards").addEventListener("click", function (e) {
		var t = e.target, c = t.closest(".card[data-g]");
		if (!editing || !c) return;
		// [계정·암호]: 계정·암호·메모 칸 열고 닫기, 👁: 암호 보이기 (다시 그리지 않음)
		if (t.hasAttribute("data-lkey")) {
			var lk = t.closest(".lk");
			lk.classList.toggle("open");
			if (lk.classList.contains("open")) lk.querySelector("[data-la]").focus();
			return;
		}
		if (t.hasAttribute("data-lpeye")) {
			var pi = t.closest(".lk").querySelector("[data-lp]");
			pi.type = pi.type === "password" ? "text" : "password";
			return;
		}
		collect();
		var gi = +c.getAttribute("data-g"), g = draft.groups[gi];
		if (t.hasAttribute("data-gmv")) {
			var to = gi + +t.getAttribute("data-gmv");
			if (to < 0 || to >= draft.groups.length) return;
			draft.groups.splice(to, 0, draft.groups.splice(gi, 1)[0]);
		} else if (t.hasAttribute("data-gdel")) {
			if (g.links.length && !confirm("'" + (g.title || "이름 없음") + "' 카테고리와 링크 " + g.links.length + "개를 지울까요?")) return;
			draft.groups.splice(gi, 1);
		} else if (t.hasAttribute("data-ldel")) {
			g.links.splice(+t.closest(".lk").getAttribute("data-l"), 1);
		} else if (t.hasAttribute("data-ladd")) {
			g.links.push({ id: uid("l"), title: "", url: "" });
			renderEdit();
			var rows = $("cards").querySelectorAll('.card[data-g="' + gi + '"] [data-lt]');
			rows[rows.length - 1].focus();
			return;
		} else return;
		renderEdit();
	});
	// 끌어서 옮기기: 링크 줄 위에 놓으면 그 앞에, 카드 빈 곳에 놓으면 맨 뒤에
	var dragFrom = null;
	$("cards").addEventListener("dragstart", function (e) {
		var r = e.target.closest && e.target.closest(".lk");
		if (!r) return;
		collect();
		dragFrom = { g: +r.closest(".card").getAttribute("data-g"), l: +r.getAttribute("data-l") };
		r.classList.add("drag");
		e.dataTransfer.effectAllowed = "move";
		e.dataTransfer.setData("text/plain", "");
	});
	$("cards").addEventListener("dragover", function (e) {
		if (!dragFrom) return;
		var c = e.target.closest(".card[data-g]");
		if (!c) return;
		e.preventDefault();
		$("cards").querySelectorAll(".over").forEach(function (x) { x.classList.remove("over"); });
		(e.target.closest(".lk") || c).classList.add("over");
	});
	$("cards").addEventListener("drop", function (e) {
		if (!dragFrom) return;
		e.preventDefault();
		var c = e.target.closest(".card[data-g]");
		if (!c) return;
		var r = e.target.closest(".lk"), to = +c.getAttribute("data-g");
		var link = draft.groups[dragFrom.g].links.splice(dragFrom.l, 1)[0];
		var at = r ? +r.getAttribute("data-l") : draft.groups[to].links.length;
		if (r && to === dragFrom.g && dragFrom.l < at) at--;
		draft.groups[to].links.splice(at, 0, link);
		dragFrom = null;
		renderEdit();
	});
	$("cards").addEventListener("dragend", function () {
		dragFrom = null;
		$("cards").querySelectorAll(".over, .drag").forEach(function (x) { x.classList.remove("over", "drag"); });
	});

	function save(next, force) {
		next.type = "links";
		next.savedAt = now();
		msg("저장 중…");
		return fetch(API + "&ver=" + encodeURIComponent(ver) + (force ? "&force=1" : ""), {
			method: "POST", headers: { "Content-Type": "application/json; charset=UTF-8" }, body: JSON.stringify(next)
		}).then(function (r) {
			return r.json().then(function (j) { return { s: r.status, j: j }; });
		}).then(function (x) {
			if (x.s === 409) {
				if (confirm("다른 창에서 먼저 저장한 내용이 있습니다. 지금 내용으로 덮어쓸까요? (먼저 저장된 내용은 백업에 남습니다)")) return save(next, true);
				throw new Error("저장하지 않았습니다.");
			}
			if (x.s !== 200) throw new Error(x.j.error || x.s);
			ver = x.j.ver;
			data = next;
			data.savedAt = x.j.savedAt;
			editing = false;
			render();
			msg("저장했습니다. " + x.j.savedAt, "ok");
		}).catch(function (e) { msg("저장 실패: " + e.message, "err"); });
	}
	$("bSave").onclick = function () {
		collect();
		// 이름 없는 카테고리 · 주소 없는 링크는 뺌, 주소에 https:// 붙이기
		draft.groups.forEach(function (g) {
			g.links = g.links.filter(function (l) { return l.url; }).map(function (l) {
				if (!/^[a-z][a-z0-9+.-]*:/i.test(l.url)) l.url = "https://" + l.url;
				if (!l.title) l.title = host(l.url) || l.url;
				return l;
			});
		});
		draft.groups = draft.groups.filter(function (g) { return g.title || g.links.length; }).map(function (g) { g.title = g.title || "이름 없음"; return g; });
		save(draft);
	};
	document.addEventListener("keydown", function (e) {
		if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "s" && editing) { e.preventDefault(); $("bSave").click(); }
	});
	window.addEventListener("beforeunload", function (e) {
		if (!editing) return;
		collect();
		if (JSON.stringify(draft.groups) !== JSON.stringify(data.groups)) { e.preventDefault(); e.returnValue = ""; }
	});

	// ---------------------------------------------------------------- 크롬 즐겨찾기 가져오기
	$("bImp").onclick = function () {
		$("imp").classList.add("open");
		$("impMsg").textContent = "프로필 찾는 중…";
		fetch("bookmarks.jsp?profiles=1", { cache: "no-store" }).then(function (r) { return r.json(); }).then(function (ps) {
			$("impProfile").innerHTML = ps.map(function (p) {
				return '<option value="' + esc(p.dir) + '">' + esc(p.name) + (p.user ? " (" + esc(p.user) + ")" : "") + " · " + esc(p.dir) + "</option>";
			}).join("");
			// mklee 프로필을 먼저 고름
			var me = ps.filter(function (p) { return p.name === "mklee"; })[0];
			if (me) $("impProfile").value = me.dir;
			$("impMsg").textContent = ps.length ? "" : "크롬 즐겨찾기를 찾지 못했습니다.";
		}).catch(function (e) { $("impMsg").textContent = "읽기 실패: " + e.message; });
	};
	$("impClose").onclick = function () { $("imp").classList.remove("open"); };
	// 크롬 즐겨찾기 바 -> [{title, links}] (폴더 안 폴더는 "상위 / 하위", 바에 바로 있는 링크는 "즐겨찾기 바")
	function fromChrome(bar) {
		var groups = [], loose = { title: "즐겨찾기 바", links: [] };
		function walk(node, path) {
			var g = { title: path, links: [] }, subs = [];
			(node.children || []).forEach(function (c) {
				if (c.type === "url") g.links.push({ title: c.name, url: c.url });
				else if (c.type === "folder") subs.push(c);
			});
			if (g.links.length) groups.push(g);
			subs.forEach(function (s) { walk(s, path + " / " + s.name); });
		}
		(bar.children || []).forEach(function (c) {
			if (c.type === "url") loose.links.push({ title: c.name, url: c.url });
			else if (c.type === "folder") walk(c, c.name);
		});
		if (loose.links.length) groups.unshift(loose);
		return groups;
	}
	$("impGo").onclick = function () {
		var dir = $("impProfile").value;
		if (!dir) return;
		$("impMsg").textContent = "읽는 중…";
		fetch("bookmarks.jsp?profile=" + encodeURIComponent(dir), { cache: "no-store" }).then(function (r) {
			if (!r.ok) throw new Error(r.status);
			return r.json();
		}).then(function (b) {
			var gs = fromChrome(b.roots.bookmark_bar), next = JSON.parse(JSON.stringify(data)), addG = 0, addL = 0;
			gs.forEach(function (ig) {
				var g = next.groups.filter(function (x) { return x.title === ig.title; })[0];
				if (!g) { g = { id: uid("g"), title: ig.title, links: [] }; next.groups.push(g); addG++; }
				var have = {};
				next.groups.forEach(function (x) { x.links.forEach(function (l) { have[l.url] = 1; }); });
				ig.links.forEach(function (l) {
					if (have[l.url]) return;
					g.links.push({ id: uid("l"), title: l.title, url: l.url });
					have[l.url] = 1;
					addL++;
				});
			});
			next.groups = next.groups.filter(function (g) { return g.links.length; });
			if (!addL) { $("impMsg").textContent = "새로 가져올 링크가 없습니다."; return; }
			$("imp").classList.remove("open");
			return save(next).then(function () { msg("가져왔습니다: 카테고리 " + addG + "개 새로, 링크 " + addL + "개", "ok"); });
		}).catch(function (e) { $("impMsg").textContent = "가져오기 실패: " + e.message; });
	};

	// ---------------------------------------------------------------- 시작
	fetch(API, { cache: "no-store" }).then(function (r) {
		if (r.status === 404) return null;
		if (!r.ok) throw new Error(r.status);
		ver = r.headers.get("X-Ver") || "";
		return r.json();
	}).then(function (j) {
		if (j && j.groups) data = j;
		render();
	}).catch(function (e) { render(); msg("불러오기 실패: " + e.message, "err"); });
</script>
