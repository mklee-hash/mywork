<!DOCTYPE html>
<html>
<head>
<script src="../common/static.js" data-root="../"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MY Work</title>
<style>
	body { margin: 0; font-family: "맑은 고딕", "Malgun Gothic", sans-serif; font-size: 14px; color: #0f172a; background: #f1f5f9; }
	.box { max-width: 560px; margin: 80px auto; padding: 28px 30px; background: #fff; border: 1px solid #e2e8f0; border-radius: 10px; }
	h2 { margin: 0 0 10px; font-size: 18px; }
	p { margin: 0; color: #64748b; line-height: 1.7; }
</style>
</head>
<body>
<div class="box"><h2 id="h"></h2><p id="p"></p></div>
<script>
	var q = new URLSearchParams(location.search), m = q.get("m"), t = q.get("t") || "내 PC 전용";
	// 내 PC 전용인 이유 (메뉴별)
	var WHY = { "고객지원": "고객지원은 내 PC의 MY Work agent가 HDMS·메일·질답을 실시간으로 확인하는 화면이라 GitHub 보기 사이트에서는 볼 수 없습니다." };
	var T = {
		skill: ["스킬", "준비 중입니다. 어떤 내용을 둘지 정해지면 이 메뉴에 화면을 만듭니다."],
		pc: [t, (WHY[t] || "OZ 서버가 필요한 화면이라 GitHub 보기 사이트에서는 동작하지 않습니다.") + " 내 PC의 MY Work(http://localhost/mywork)에서 여세요."]
	}[m] || ["MY Work", ""];
	document.getElementById("h").textContent = T[0];
	document.getElementById("p").textContent = T[1];
</script>
</body>
</html>
